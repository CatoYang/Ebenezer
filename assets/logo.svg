<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Ebenezer: a cairn (stones of remembrance) crowned with a gold cross, against a dawn sky.
       Telegram crops to a circle, so everything stays within the central circle. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f50"/>
      <stop offset="0.55" stop-color="#2e5a88"/>
      <stop offset="0.85" stop-color="#d9a95b"/>
      <stop offset="1" stop-color="#f1cf86"/>
    </linearGradient>
    <radialGradient id="glow" cx="320" cy="500" r="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c4" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffd98a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <!-- each stone: lit from the top left, darker underneath -->
    <radialGradient id="light" cx="0.35" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dc8c"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="url(#sky)"/>
  <circle cx="320" cy="500" r="290" fill="url(#glow)"/>

  <!-- ground -->
  <path d="M0 528 Q320 478 640 528 L640 640 L0 640 Z" fill="#1d2c45"/>
  <ellipse cx="324" cy="530" rx="175" ry="16" fill="#000" opacity="0.3"/>

  <!-- the cross, standing in the top stone (drawn first so the stone covers its foot) -->
  <g transform="translate(4 4)" fill="#000" opacity="0.3">
    <rect x="309" y="96" width="24" height="122" rx="4"/>
    <rect x="276" y="128" width="90" height="22" rx="4"/>
  </g>
  <g fill="url(#gold)">
    <rect x="309" y="96" width="24" height="122" rx="4"/>
    <rect x="276" y="128" width="90" height="22" rx="4"/>
  </g>

  <!-- stones, bottom to top -->
  <g transform="rotate(-2 320 482)">
    <ellipse cx="320" cy="482" rx="162" ry="56" fill="#8a8275"/>
    <ellipse cx="320" cy="482" rx="162" ry="56" fill="url(#light)"/>
    <ellipse cx="320" cy="482" rx="162" ry="56" fill="url(#shade)"/>
  </g>
  <g transform="rotate(-5 310 400)">
    <ellipse cx="310" cy="400" rx="126" ry="46" fill="#aaa295"/>
    <ellipse cx="310" cy="400" rx="126" ry="46" fill="url(#light)"/>
    <ellipse cx="310" cy="400" rx="126" ry="46" fill="url(#shade)"/>
  </g>
  <g transform="rotate(6 330 330)">
    <ellipse cx="330" cy="330" rx="93" ry="38" fill="#968d81"/>
    <ellipse cx="330" cy="330" rx="93" ry="38" fill="url(#light)"/>
    <ellipse cx="330" cy="330" rx="93" ry="38" fill="url(#shade)"/>
  </g>
  <g transform="rotate(-7 316 271)">
    <ellipse cx="316" cy="271" rx="64" ry="29" fill="#bdb5a8"/>
    <ellipse cx="316" cy="271" rx="64" ry="29" fill="url(#light)"/>
    <ellipse cx="316" cy="271" rx="64" ry="29" fill="url(#shade)"/>
  </g>
  <g transform="rotate(4 322 224)">
    <ellipse cx="322" cy="224" rx="40" ry="20" fill="#a39a8e"/>
    <ellipse cx="322" cy="224" rx="40" ry="20" fill="url(#light)"/>
    <ellipse cx="322" cy="224" rx="40" ry="20" fill="url(#shade)"/>
  </g>
</svg>
